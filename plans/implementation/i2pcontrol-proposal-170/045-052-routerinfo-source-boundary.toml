[m050]
core_production = [
  "emissary-core/src/events.rs",
  "emissary-core/src/inspection.rs",
  "emissary-core/src/transport/mod.rs",
  "emissary-core/src/transport/ntcp2/",
  "emissary-core/src/transport/ssu2/",
]
purpose = "neutral v4/v6 status error testing observation at existing reachability transitions"

[m051]
core_production = []
purpose = "news and banned-peer semantic adjudication; no new router news/ban subsystem authorized"

[m052]
core_production = []
purpose = "validation and independent reclosure only"

[m053]
core_production = [
  "emissary-core/src/inspection.rs",
  "emissary-core/src/router/mod.rs",
]
purpose = "correct M045 with a neutral cloneable request-time live ProfileStorage-backed peer-directory inspection source"
forbidden_core_production = [
  "emissary-core/src/profile.rs",
  "emissary-core/src/router/context.rs",
  "emissary-core/src/lib.rs",
  "emissary-core/src/netdb/",
]
required_regression = "construct source, mutate canonical ProfileStorage through existing owner, then observe mutation from same source instance"

[prohibited]
production_prefixes = [
  "emissary-core/src/crypto/",
  "emissary-core/src/destination/",
  "emissary-core/src/i2cp/",
  "emissary-core/src/i2np/",
  "emissary-cli/src/address_book.rs",
  "emissary-cli/src/proxy/",
  "emissary-cli/src/ui/",
  ".github/workflows/",
]
behaviors = [
  "router or peer selection policy changes",
  "tunnel selection/build/routing algorithm changes",
  "transport handshake/retransmission/congestion changes",
  "NetDB protocol/query/discovery behavior changes",
  "new network probes or polling solely for I2PControl",
  "mutable core/session/tunnel/transport handles crossing into I2PControl",
  "private keys session keys LeaseSet private material or message payloads in inspection DTOs",
  "fabricated defaults standing in for unavailable sources",
  "new tunnel data planes",
  "upstream issue PR review submission adoption merge or maintainer interaction"
]
