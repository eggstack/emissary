[m049]
core_production = [
  "emissary-core/src/events.rs",
  "emissary-core/src/inspection.rs",
  "emissary-core/src/tunnel/mod.rs",
  "emissary-core/src/tunnel/pool.rs",
  "emissary-core/src/tunnel/transit.rs",
]
