  "emissary-core/src/inspection.rs",
  "emissary-core/src/transport/mod.rs",
  "emissary-core/src/router/mod.rs",
]
purpose = "neutral cloneable active-peer and transport-limit inspection source"

[m047]
core_production = [
  "emissary-core/src/inspection.rs",
  "emissary-core/src/transport/mod.rs",
  "emissary-core/src/router/mod.rs",
  "emissary-core/src/transport/ntcp2/",
  "emissary-core/src/transport/ssu2/",
]
purpose = "sanitized active-peer statistics only where exact owners require passive observation"

[m048]
core_production = [
  "emissary-core/src/inspection.rs",
  "emissary-core/src/router/mod.rs",
  "emissary-core/src/tunnel/mod.rs",
  "emissary-core/src/tunnel/pool.rs",
  "emissary-core/src/tunnel/transit.rs",
]
