version = 2
objective = "M045-M053 Proposal 170 RouterInfo source completion with minimal non-i2pcontrol changes"
baseline = "b759038"
corrective_baseline = "bf9c2eeb"

[always_allowed]
i2pcontrol = ["emissary-cli/src/i2pcontrol/"]
composition_only = ["emissary-cli/src/main.rs"]
planning_tests_docs = ["plans/", "docs/i2pcontrol/", "emissary-cli/tests/"]

