[allowed_production_paths]
# The M062 test consumes this list as an exact-path allowlist in addition to its
# named production-path helpers. The M109-M122 entries and the post-M114
# corrective roadmap below are planning documents only; their presence here
# does not authorize any production path, dependency, or lockfile change.
# Future execution still requires registry readiness and the exact production
# authority stated by each plan. ADR-0005 authorizes only the I2PControl-owned
# exact-revision Yosemite fork alias; M122 advances the landed revision to Y004
# (c2db73d) with corrected LeaseSet wire semantics and adapter reachability only.
root_manifests = [
  "Cargo.toml",
  "emissary-cli/Cargo.toml",
  "emissary-core/src/config.rs",
  "plans/implementation/i2pcontrol-proposal-170/109-startup-managed-tunnel-action-semantics-corrective.md",
  "plans/implementation/i2pcontrol-proposal-170/110-shared-client-session-and-destination-key-ownership-completion.md",
