[dependency_rule]
direct_ownership = "A direct dependency whose only direct consumer is code gated by feature = \"i2pcontrol\" must itself be optional and activated by the i2pcontrol feature. It must not be an unconditional dependency of the default Emissary CLI or a workspace-level dependency unless an independently justified non-I2PControl workspace consumer exists."
transitive_permitted = true
crate_name_absence_not_required = true

[[evidence]]
crate = "subtle"
direct_consumer = "emissary-cli/src/i2pcontrol/auth.rs"
feature_gated_consumer = true
feature = "i2pcontrol"
constant_time_primitive = "subtle::ConstantTimeEq / subtle::Choice"
rationale = "Reviewed constant-time password comparison is required by the accepted I2PControl authentication contract; ownership is corrected to make the dependency optional and feature-owned without altering the reviewed primitive."
reference = "M062 plan §4.2 and §11"

[[evidence]]
crate = "subtle"
non_i2pcontrol_workspace_consumer = false
non_i2pcontrol_literal_consumer = "emissary-core (literal version, NOT a workspace reference)"
rationale = "emissary-core declares subtle = { version = \"2.6.1\", default-features = false } with a literal version in emissary-core/Cargo.toml and uses it directly in emissary-core/src/crypto/dsa.rs. That declaration does not require a [workspace.dependencies] entry and is unchanged by M062."
reference = "M062 plan §4.1 and §7 Step A"

[[evidence]]
crate = "curve25519-dalek"
direct_consumer = "emissary-core/src/crypto/red25519.rs"
feature_gated_consumer = false
feature = "none (unconditional core neutral primitive)"
constant_time_primitive = "curve25519_dalek::Scalar / EdwardsPoint constant-time ops"
rationale = "M156 neutral Red25519/blinding requires Edwards-point addition, scalar mod-L addition/reduction, and basepoint multiplication not exposed by ed25519-dalek/x25519-dalek. Direct curve25519-dalek 5.0.0-pre.6 with default-features=false, features=[alloc,precomputed-tables,zeroize] reuses the exact transitive version (no new version), is no_std compatible (#![no_std] + alloc), and is unconditional core-owned per dependency_rule (consumer is not i2pcontrol-gated)."
reference = "M155 §6 dependency freeze; M156 registration"
